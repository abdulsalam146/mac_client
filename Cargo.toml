# Mirror workspace: client subset only. GENERATED FILE — source of truth
# is tools/sync_client_mirror.py in the private repo; do not edit here.
[workspace]
resolver = "2"
members = [
    "crates/aztna-common",
    "crates/aztna-keys",
    "client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
aztna-common = { path = "crates/aztna-common" }
aztna-keys = { path = "crates/aztna-keys" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
axum = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
quinn = "0.11"
