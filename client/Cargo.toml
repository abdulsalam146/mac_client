[package]
name = "aztna-client"
version.workspace = true
edition.workspace = true

[[bin]]
name = "glmcli"
path = "src/bin/glmcli.rs"

[[bin]]
name = "glmsvc"
path = "src/bin/glmsvc.rs"

[dependencies]
anyhow = { workspace = true }
prometheus = { version = "0.13", default-features = false }
clap = { workspace = true }
serde = { workspace = true }
serde_json = "1"
toml = { workspace = true }
aztna-common = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true }
base64 = "0.22"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
x509-parser = "0.16"
asn1-rs = "0.6"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
quinn = { workspace = true }
# W14: TLS-TCP data carrier (same mTLS discipline as the QUIC carrier)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# W13: CancellationToken (engine kill path + existing cancel discipline)
tokio-util = { version = "0.7", features = ["rt"] }

# W29: Windows-only surface (WMI posture collectors, NCrypt/DPAPI identity,
# Win32 tray) — target-gated like aztna-common, inert on the Linux client.
[target.'cfg(windows)'.dependencies]
wmi = "0.14"

# W29 step 2: AZDP2 at-rest wrap (W21 machinery) for the unix clients
# W29 step 7: libc for SO_PEERCRED (Linux UDS IPC peer credentials).
# W30 step 1: tss-esapi moved OUT of this block — Linux-only (macOS is
# unix too, has no TPM2/libtss2; its TPM config path fails closed with
# a named error instead — plan §3.3, step 2).
[target.'cfg(unix)'.dependencies]
aztna-keys = { workspace = true }
libc = "0.2"

# W29 step 4: TPM tier via tss-esapi — requires system tpm2-tss >= 4.1.3
# (Ubuntu 24.04's apt 4.0.1 is too old; build from source — deployment.md)
# and clang for the generated bindings.
# W30 step 1: re-gated from cfg(unix) to Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = { version = "8.0.0-alpha.3", features = ["generate-bindings"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
]